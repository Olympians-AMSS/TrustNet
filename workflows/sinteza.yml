name: Actualizare sinteza

on:
  push:
    branches:
      - main
    paths:
      - 'dosar/**/*.md'
      - 'scripts/generate_sinteza.py'
      - '.github/workflows/sinteza.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinteza-main
  cancel-in-progress: false

jobs:
  genereaza:
    runs-on: ubuntu-latest
    steps:
      - name: Preia repository-ul
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Genereaza sinteza
        run: python3 scripts/generate_sinteza.py

      - name: Salveaza modificarile daca exista
        run: |
          if git diff --quiet -- SINTEZA.md; then
            echo "Sinteza este deja actualizata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SINTEZA.md
          git commit -m "docs: actualizeaza automat sinteza"
          git push
