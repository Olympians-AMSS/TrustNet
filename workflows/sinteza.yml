
name: Actualizare sinteza

on:
  push:
    branches: [main]
    paths:
      - "dosar/**"
      - "scripts/generate_sinteza.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Genereaza sinteza
        run: python3 scripts/generate_sinteza.py

      - name: Salveaza modificarile
        run: |
          if ! git diff --quiet -- SINTEZA.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SINTEZA.md
            git commit -m "Actualizare automata sinteza"
            git push
          fi
  
